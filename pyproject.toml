[project]
name = "RAG-against-the-machine"
version = "1.0.0"
requires-python = ">=3.10"
description = ""
authors = [
    {name = "scamlett"}
]
dependencies = [
    "pydantic",
    "fire",
    "tqdm",
    "torch",
    "transformers",
    "accelerate"
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
