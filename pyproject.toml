[project]
name = "RAG-against-the-machine"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "fire",
    "tqdm",
    "torch",
    "transformers",
    "accelerate"
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest",
    "types-tqdm"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
